name: Build Android APK and send to Slack

on:
  push:
    branches: [main]
    paths-ignore:
      - "AGENTS.md"
      - "README.md"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK was produced."
            exit 1
          fi
          OUTPUT_PATH="${{ runner.temp }}/${{ github.event.repository.name }}-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$OUTPUT_PATH"
          echo "path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"

      - name: Save APK as GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-debug-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload APK to Slack
        uses: slackapi/slack-github-action@v3.0.5
        with:
          errors: true
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
            initial_comment: "✅ ${{ github.event.repository.name }} build #${{ github.run_number }} is ready for testing. Commit: ${{ github.sha }}"
            file: "${{ steps.apk.outputs.path }}"
            filename: "${{ github.event.repository.name }}-${{ github.run_number }}.apk"
